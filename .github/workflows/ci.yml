name: CI

on:
  # Branch pushes are covered by pull_request. Listing both would run every
  # job twice on any branch that has an open pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  static:
    name: Static validation
    # Matches the deployment target recorded in BUILD_REPORT.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Legacy identifiers
        run: bash scripts/check_legacy_identifiers.sh

      - name: Python compilation
        run: python -m compileall -q src tests examples

      - name: Shell syntax
        run: bash -n install.sh scripts/*.sh scripts/alpha-spy-backup

      - name: systemd units and timers
        run: bash scripts/verify_units.sh

  workstation:
    name: Workstation front end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      # The wheel ships pre-built assets so a trading VPS never needs Node. That
      # only holds if the committed bundle matches the committed sources, so a
      # rebuild that changes anything under static/ fails the job.
      - name: Committed bundle is current
        run: |
          if ! git diff --quiet -- src/alpha_spy/dashboard/static; then
            echo "::error::The committed workstation bundle is stale."
            echo "Run 'make frontend' and commit src/alpha_spy/dashboard/static/."
            git --no-pager diff --stat -- src/alpha_spy/dashboard/static
            exit 1
          fi

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented floor; 3.12 is what Ubuntu 24.04 ships.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the suite with dev extras
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: PYTHONPATH=src:. pytest -q

  package:
    name: Build, verify and smoke test
    runs-on: ubuntu-24.04
    needs: [static, test]
    steps:
      - uses: actions/checkout@v4
        with:
          # build_release.sh derives SOURCE_DATE_EPOCH from the HEAD commit
          # so archives are reproducible; that needs real commit metadata.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip wheel build

      - name: Build the release archives
        run: make release

      - name: Verify the archives against their manifests
        run: make verify-release

      - name: Smoke test the built wheel
        run: make smoke

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alpha-spy
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.sha256
            dist/release/RELEASE_MANIFEST.sha256
          retention-days: 14

  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    # Gating. The rule set is pinned in pyproject.toml, so this stays stable
    # across ruff releases instead of growing new findings on every upgrade.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install "ruff>=0.8,<1"

      - name: Lint
        run: ruff check --output-format=github src tests examples
