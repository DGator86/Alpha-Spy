name: Publish GUI preview

# Publishes preview/standalone-command-center.html to GitHub Pages so the
# Command Center layout can be reviewed without installing the suite or
# opening an SSH tunnel.
#
# The preview is static and self-contained: it holds no live data, no
# credentials, and no connection to a running instance.
#
# Enable once under Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "preview/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -Eeuo pipefail
          mkdir -p _site
          cp preview/standalone-command-center.html _site/index.html
          cp preview/command-center.png _site/command-center.png
          # Pages would otherwise strip files and directories starting with _.
          touch _site/.nojekyll

      - name: Verify the preview is self-contained
        run: |
          set -Eeuo pipefail
          if grep -qE '(src|href)="https?://' _site/index.html; then
            echo "::error::The preview references external resources; it must stay self-contained"
            exit 1
          fi
          echo "No external resource references."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
