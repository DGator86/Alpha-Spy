name: Publish GUI preview

# Publishes the workstation to GitHub Pages so the interface can be reviewed
# without installing the suite or opening an SSH tunnel.
#
# The preview is a real build of frontend/ with the network layer replaced by a
# committed synthetic snapshot (frontend/src/demo/snapshot.json, regenerated by
# scripts/generate_preview_snapshot.py). Building the shipping application
# rather than maintaining a separate mock is what keeps the published page from
# drifting away from the product.
#
# It holds no live data, no credentials, and no connection to a running
# instance; operator commands are disabled in this build.
#
# Enable once under Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "preview/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build the static preview
        run: npm run build:preview
        working-directory: frontend

      - name: Assemble the site
        run: |
          set -Eeuo pipefail
          mkdir -p _site
          cp -r frontend/dist-preview/. _site/
          cp preview/command-center.png _site/command-center.png
          # Pages would otherwise strip files and directories starting with _.
          touch _site/.nojekyll

      - name: Verify the preview is self-contained
        run: |
          set -Eeuo pipefail
          if grep -rqE '(src|href)="https?://' _site/*.html; then
            echo "::error::The preview references external resources; it must stay self-contained"
            exit 1
          fi
          # The preview must be snapshot-backed. Its data comes from a separate
          # chunk that only the VITE_STATIC_DEMO path imports, so the chunk's
          # presence is what distinguishes a preview build from an ordinary one
          # that would sit on a public page trying to reach a dashboard.
          if ! ls _site/assets/snapshot-*.js >/dev/null 2>&1; then
            echo "::error::No snapshot chunk in the bundle; this is not a static-preview build."
            echo "Build it with 'npm run build:preview', not 'npm run build'."
            exit 1
          fi
          echo "Self-contained and snapshot-backed."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
