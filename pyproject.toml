[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-spy"
version = "3.0.0"
description = "Complete constituent-driven SPY options research, execution, audit, confirmation, and dashboard suite"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Alpha-SPY Project"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
# tabulate backs DataFrame.to_markdown(), which every research driver under
# examples/ calls when it writes its REPORT.md. It is not needed by the
# installed runtime under src/, so it stays out of the core dependency list
# and off the trading VPS.
research = ["tabulate>=0.9,<1"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.8,<1", "tabulate>=0.9,<1"]

[project.scripts]
alpha-spy = "alpha_spy.cli:main"
spy-alpha = "alpha_spy.research.cli:app"
spy-alpha-dashboard = "alpha_spy.dashboard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Recursive: the workstation build emits hashed bundles into static/assets/,
# and a single-level "static/*" glob would ship index.html without its scripts.
"alpha_spy.dashboard" = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

# The rule set is pinned explicitly. Left unset, ruff enables whatever its
# current default is (826 rules as of 0.16), so a ruff upgrade would silently
# reintroduce findings in a codebase that was clean the day before.
[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade — the suite requires Python 3.11+
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",  # ruff-specific
]
ignore = [
  # Line length is advisory here. The research and strategy modules carry long
  # literal tables and report strings; enforcing 110 would rewrite 542 lines of
  # trading logic for no behavioural gain. line-length above still guides
  # formatters.
  "E501",
]

# The research drivers write markdown reports whose prose uses a real en dash.
# That is intended typography in report text, not a homoglyph mistake.
allowed-confusables = ["–"]

# Deliberately not selected, because clearing them would mean changing
# behaviour in live trading code rather than tidying it:
#   BLE001  blind-except      — the market, universe and backup paths catch
#                               broad exceptions on purpose so a bad feed
#                               degrades data health instead of killing a
#                               service mid-session.
#   S110    try-except-pass   — same fail-soft intent.
#   FURB    refurb            — opinionated rewrites over timestamp parsing in
#                               the audit tape.
#   PYI     stub-file rules   — no stub files in this project.

[tool.ruff.lint.per-file-ignores]
# The research drivers put <repo>/src on sys.path before importing the package,
# so their package imports necessarily follow module-level code. Marking each
# import individually would force every one of them onto multiple lines.
"examples/**" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# B008 guards against a mutable default shared across calls. Each of these is
# either immutable or framework API, so the shared instance is intentional:
#   typer.Argument/Option  parameter metadata, evaluated at decoration time
#   pandas.Timedelta       immutable scalar
#   ScanSettings           @dataclass(frozen=True), only ever read
extend-immutable-calls = [
  "typer.Argument",
  "typer.Option",
  "pandas.Timedelta",
  "alpha_spy.research.signals.mispricing.ScanSettings",
]

[tool.ruff.lint.isort]
known-first-party = ["alpha_spy", "alpha_spy.dashboard", "alpha_spy.research"]
