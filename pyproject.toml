[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-spy"
version = "3.0.0"
description = "Complete constituent-driven SPY options research, execution, audit, confirmation, and dashboard suite"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Alpha-SPY Project"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
research = ["tabulate>=0.9,<1"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.8,<1", "tabulate>=0.9,<1"]

[project.scripts]
alpha-spy = "alpha_spy.cli:main"
spy-alpha = "alpha_spy.research.cli:app"
spy-alpha-dashboard = "alpha_spy.dashboard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"alpha_spy.dashboard" = ["static/*", "static/assets/*", "static/assets/*.js", "static/assets/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
]
ignore = ["E501"]
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402"]
# Explicit legacy/style debt. These exceptions are intentionally narrow so
# functional lint remains enforced while V2 research does not rewrite proven
# trading behavior merely to satisfy stylistic simplification rules.
"src/alpha_spy/fail_safes.py" = ["SIM103"]
"src/alpha_spy/hardening.py" = ["I001"]
"src/alpha_spy/position_management.py" = ["SIM102"]
"tests/test_friday_fail_safes.py" = ["SIM300"]
# V2 research files are still under active architecture iteration; import-order
# and narrow import-only findings are non-functional and tracked explicitly.
"src/alpha_spy/strategy_v2.py" = ["C401"]
"src/alpha_spy/strategy_v2_complete.py" = ["I001"]
"src/alpha_spy/strategy_v2_execution.py" = ["I001"]
"src/alpha_spy/strategy_v2_prior.py" = ["I001"]
"src/alpha_spy/v2_engine.py" = ["I001"]
"src/alpha_spy/v2_hgb_vertical.py" = ["F401"]
"src/alpha_spy/v2_runtime.py" = ["I001"]
"src/alpha_spy/v2_settlement.py" = ["I001"]
"src/alpha_spy/v2_trader_agent.py" = ["F401"]
"tests/test_v2_complete_geometry.py" = ["I001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "typer.Argument",
  "typer.Option",
  "pandas.Timedelta",
  "alpha_spy.research.signals.mispricing.ScanSettings",
]

[tool.ruff.lint.isort]
known-first-party = ["alpha_spy", "alpha_spy.dashboard", "alpha_spy.research"]
