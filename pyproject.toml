[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spy-constituent-alpha-suite"
version = "2.0.0"
description = "Complete constituent-driven SPY options research, execution, audit, confirmation, and dashboard suite"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "SPY Constituent Alpha Project"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.8,<1"]

[project.scripts]
spy-der = "spy_der.cli:main"
spy-alpha = "spy_constituent_alpha.cli:app"
spy-alpha-dashboard = "spy_alpha_dashboard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spy_alpha_dashboard = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
