[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-spy"
version = "3.0.0"
description = "Complete constituent-driven SPY options research, execution, audit, confirmation, and dashboard suite"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Alpha-SPY Project"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
# tabulate backs DataFrame.to_markdown(), which every research driver under
# examples/ calls when it writes its REPORT.md. It is not needed by the
# installed runtime under src/, so it stays out of the core dependency list
# and off the trading VPS.
research = ["tabulate>=0.9,<1"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.8,<1", "tabulate>=0.9,<1"]

[project.scripts]
alpha-spy = "alpha_spy.cli:main"
alpha-spy-v2 = "alpha_spy.v2_runtime:main"
spy-alpha = "alpha_spy.research.cli:app"
spy-alpha-dashboard = "alpha_spy.dashboard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# MANIFEST.in recursive-include is the source of truth. These patterns are the
# fallback when a VPS `pip install --no-deps .` would otherwise ship index.html
# and drop static/assets/*. That happened on 82.29.155.71.
"alpha_spy.dashboard" = ["static/*", "static/assets/*", "static/assets/*.js", "static/assets/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

# The rule set is pinned explicitly. Left unset, ruff enables whatever its
# current default is (826 rules as of 0.16), so a ruff upgrade would silently
# reintroduce findings in a codebase that was clean the day before.
[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
]
ignore = ["E501"]
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "typer.Argument",
  "typer.Option",
  "pandas.Timedelta",
  "alpha_spy.research.signals.mispricing.ScanSettings",
]

[tool.ruff.lint.isort]
known-first-party = ["alpha_spy", "alpha_spy.dashboard", "alpha_spy.research"]
